<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Body -->
  <ellipse cx="100" cy="165" rx="55" ry="60" fill="#F4A460"/>

  <!-- Head -->
  <circle cx="100" cy="90" r="52" fill="#F4A460"/>

  <!-- Left ear -->
  <polygon points="55,50 42,15 78,42" fill="#F4A460"/>
  <polygon points="57,47 48,24 72,44" fill="#FFB6C1"/>

  <!-- Right ear -->
  <polygon points="145,50 158,15 122,42" fill="#F4A460"/>
  <polygon points="143,47 152,24 128,44" fill="#FFB6C1"/>

  <!-- Face -->
  <!-- Eyes -->
  <ellipse cx="82" cy="88" rx="12" ry="13" fill="white"/>
  <ellipse cx="118" cy="88" rx="12" ry="13" fill="white"/>
  <circle cx="84" cy="90" r="7" fill="#2d2d2d"/>
  <circle cx="120" cy="90" r="7" fill="#2d2d2d"/>
  <circle cx="86" cy="87" r="2.5" fill="white"/>
  <circle cx="122" cy="87" r="2.5" fill="white"/>

  <!-- Nose -->
  <polygon points="100,104 95,110 105,110" fill="#FF6B8A"/>

  <!-- Mouth -->
  <path d="M95,110 Q100,116 105,110" stroke="#8B4513" stroke-width="1.5" fill="none"/>
  <path d="M95,110 Q88,117 83,112" stroke="#8B4513" stroke-width="1.5" fill="none"/>
  <path d="M105,110 Q112,117 117,112" stroke="#8B4513" stroke-width="1.5" fill="none"/>

  <!-- Whiskers left -->
  <line x1="50" y1="106" x2="90" y2="109" stroke="#8B4513" stroke-width="1.2" opacity="0.7"/>
  <line x1="48" y1="112" x2="90" y2="112" stroke="#8B4513" stroke-width="1.2" opacity="0.7"/>
  <line x1="50" y1="118" x2="90" y2="115" stroke="#8B4513" stroke-width="1.2" opacity="0.7"/>

  <!-- Whiskers right -->
  <line x1="150" y1="106" x2="110" y2="109" stroke="#8B4513" stroke-width="1.2" opacity="0.7"/>
  <line x1="152" y1="112" x2="110" y2="112" stroke="#8B4513" stroke-width="1.2" opacity="0.7"/>
  <line x1="150" y1="118" x2="110" y2="115" stroke="#8B4513" stroke-width="1.2" opacity="0.7"/>

  <!-- Belly -->
  <ellipse cx="100" cy="170" rx="32" ry="38" fill="#FFF0E0"/>

  <!-- Left arm -->
  <ellipse cx="52" cy="160" rx="15" ry="28" fill="#F4A460" transform="rotate(-15 52 160)"/>
  <ellipse cx="44" cy="182" rx="12" ry="8" fill="#F4A460"/>

  <!-- Right arm -->
  <ellipse cx="148" cy="160" rx="15" ry="28" fill="#F4A460" transform="rotate(15 148 160)"/>
  <ellipse cx="156" cy="182" rx="12" ry="8" fill="#F4A460"/>

  <!-- Left leg -->
  <ellipse cx="78" cy="215" rx="16" ry="22" fill="#F4A460"/>
  <ellipse cx="76" cy="232" rx="16" ry="8" fill="#D2956E"/>

  <!-- Right leg -->
  <ellipse cx="122" cy="215" rx="16" ry="22" fill="#F4A460"/>
  <ellipse cx="124" cy="232" rx="16" ry="8" fill="#D2956E"/>

  <!-- Tail -->
  <path d="M155,185 Q190,160 180,130 Q170,100 185,80" stroke="#F4A460" stroke-width="14" fill="none" stroke-linecap="round"/>
  <circle cx="185" cy="76" r="10" fill="#D2956E"/>

  <!-- Blush -->
  <ellipse cx="72" cy="100" rx="10" ry="6" fill="#FFB6C1" opacity="0.5"/>
  <ellipse cx="128" cy="100" rx="10" ry="6" fill="#FFB6C1" opacity="0.5"/>
</svg>
